services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexuschat
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    user: '0:0'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexus-secret-key
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data

  minio-init:
    image: curlimages/curl
    depends_on: [minio]
    environment:
      KEY: nexus-secret-key
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT --aws-sigv4 'aws:amz:us-east-1:s3' --user "nexus:$$KEY" http://minio:9000/nexuschat) && { [ "$$code" = 200 ] || [ "$$code" = 409 ]; }; do echo "waiting for minio ($$code)"; sleep 1; done

  app:
    build: .
    profiles: [app]
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexuschat
      JWT_SECRET: please-change-me-to-a-real-random-string-of-32-or-more-chars
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nexuschat
      S3_ACCESS_KEY: nexus
      S3_SECRET_KEY: nexus-secret-key
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # Публичный адрес https://….trycloudflare.com для других людей (меняется при перезапуске).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [app]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3001
    depends_on: [app]

volumes:
  pgdata:
  miniodata:
