[package]
name = "nexus-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bcrypt = "0.19.3"
bytes = "1.12.1"
chrono = "0.4.45"
cookie = "0.18.2"
diesel = { version = "2.3.14", default-features = false, features = ["chrono", "postgres_backend"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool", "async-connection-wrapper", "migrations"] }
diesel_migrations = { version = "2.3.2", default-features = false }
dotenvy = "0.15.7"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
object_store = { version = "0.14.2", features = ["aws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"

[dev-dependencies]
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
