[package]
name = "nexuschat-desktop"
version = "0.1.0"
description = "NexusChat для Windows"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
tokio = { version = "1.54.1", features = ["sync", "time"] }
